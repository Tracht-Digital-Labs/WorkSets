[package]
name = "worksets"
version = "0.1.0-alpha.1"
description = "Windows desktop presets by Tracht Digital Labs"
authors = ["Tracht Digital Labs"]
edition = "2021"
license-file = "../LICENSE"
repository = "https://github.com/Tracht-Digital-Labs/WorkSets"
default-run = "worksets"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "worksets_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.11", features = ["tray-icon"] }
tauri-plugin-autostart = "2.5"
tauri-plugin-global-shortcut = "2.3"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2.4"
atomic-write-file = "0.3"
chrono = { version = "0.4", features = ["serde"] }
parking_lot = "0.12"
regex = "1.11"
schemars = { version = "1", features = ["chrono04", "uuid1"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ureq = { version = "2.12", default-features = false, features = ["json", "tls"] }
url = "2.5"
uuid = { version = "1.18", features = ["serde", "v4"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
winvd-win10 = { package = "winvd", version = "=0.0.17" }
winvd-win11-22h2 = { package = "winvd", version = "=0.0.46" }
winvd-win11-24h2 = { package = "winvd", version = "=0.0.49" }
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_Devices_Display",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_Storage_Packaging_Appx",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_IO",
  "Win32_System_Pipes",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_UI_Accessibility",
  "Win32_UI_HiDpi",
  "Win32_UI_Shell",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_UI_WindowsAndMessaging",
] }
windows-052 = { package = "windows", version = "0.52", features = ["Win32_Foundation"] }

[dev-dependencies]
tempfile = "3.20"

