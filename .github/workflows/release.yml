name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v-prefixed tag to package
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CI: "true"
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  validate:
    name: Validate release source
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          toolchain: 1.96.0
          components: clippy,rustfmt
          rust-src-dir: src-tauri
          cache-workspaces: |
            src-tauri -> target
            fixtures/windows-app -> target

      - name: Validate synchronized version
        shell: pwsh
        run: ./scripts/assert-release-version.ps1 -Tag $env:RELEASE_TAG

      - name: Install frontend dependencies
        run: npm ci

      - name: Validate frontend
        shell: pwsh
        run: |
          npm run lint
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run typecheck
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test -- --run
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate Rust
        working-directory: src-tauri
        shell: pwsh
        run: |
          cargo fmt --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --locked --all-targets --all-features -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --all-features
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo check --locked --all-targets --all-features
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate Windows fixture
        working-directory: fixtures/windows-app
        shell: pwsh
        run: |
          cargo fmt --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo check --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate dependency licenses
        shell: pwsh
        run: ./scripts/check-licenses.ps1

  build:
    name: Build and attest (${{ matrix.arch }})
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            arch: x64
          - runner: windows-11-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          toolchain: 1.96.0
          rust-src-dir: src-tauri
          cache-workspaces: |
            src-tauri -> target
            fixtures/windows-app -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Check native Windows fixture
        working-directory: fixtures/windows-app
        run: cargo check --locked

      - name: Build NSIS installer
        run: npm run tauri -- build --bundles nsis -- --locked

      - name: Name release asset
        shell: pwsh
        run: |
          $version = $env:RELEASE_TAG.Substring(1)
          ./scripts/prepare-release-asset.ps1 `
            -Architecture "${{ matrix.arch }}" `
            -Version $version `
            -InputDirectory "src-tauri/target/release/bundle/nsis" `
            -OutputDirectory "release-assets"

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release-assets/*.exe

      - name: Upload installer artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer-${{ matrix.arch }}
          path: release-assets/*.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  draft-release:
    name: Create draft prerelease
    needs: build
    runs-on: windows-2025
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out release metadata
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Download installers
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: installer-*
          path: release-assets
          merge-multiple: true

      - name: Create checksums and verify asset set
        shell: pwsh
        run: |
          $version = $env:RELEASE_TAG.Substring(1)
          ./scripts/create-release-checksums.ps1 `
            -Version $version `
            -AssetDirectory "release-assets"

      - name: Create or update draft prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:RELEASE_TAG
          $title = "WorkSets $tag"
          $assets = @(Get-ChildItem -Path "release-assets" -File | ForEach-Object { $_.FullName })
          $assetNames = @($assets | ForEach-Object { Split-Path -Leaf $_ } | Sort-Object)

          $existingJson = gh release view $tag `
            --repo $env:GITHUB_REPOSITORY `
            --json isDraft,isPrerelease,assets 2>$null
          if ($LASTEXITCODE -eq 0) {
            $existing = $existingJson | ConvertFrom-Json
            if (-not $existing.isDraft) {
              throw "Refusing to overwrite an already published release for $tag."
            }
            $unexpectedExisting = @($existing.assets | ForEach-Object { $_.name } | Where-Object { $_ -notin $assetNames })
            if ($unexpectedExisting.Count -gt 0) {
              throw "Refusing to retain unexpected draft assets: $($unexpectedExisting -join ', ')."
            }
            gh release edit $tag `
              --repo $env:GITHUB_REPOSITORY `
              --title $title `
              --notes-file ".github/RELEASE_NOTES_ALPHA.md" `
              --draft `
              --prerelease
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            gh release upload $tag @assets `
              --repo $env:GITHUB_REPOSITORY `
              --clobber
          } else {
            gh release create $tag @assets `
              --repo $env:GITHUB_REPOSITORY `
              --title $title `
              --notes-file ".github/RELEASE_NOTES_ALPHA.md" `
              --verify-tag `
              --draft `
              --prerelease
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $releaseJson = gh release view $tag `
            --repo $env:GITHUB_REPOSITORY `
            --json isDraft,isPrerelease,assets
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $release = $releaseJson | ConvertFrom-Json
          $uploadedNames = @($release.assets | ForEach-Object { $_.name } | Sort-Object)
          $assetDifference = @(Compare-Object -ReferenceObject $assetNames -DifferenceObject $uploadedNames)
          if (-not $release.isDraft -or -not $release.isPrerelease -or $assetDifference.Count -gt 0) {
            throw "Draft prerelease verification failed for $tag."
          }
