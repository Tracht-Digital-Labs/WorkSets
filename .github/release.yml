changelog:
  exclude:
    labels:
      - skip-changelog
  categories:
    - title: Features / Funktionen
      labels:
        - enhancement
        - feature
    - title: Fixes / Korrekturen
      labels:
        - bug
        - fix
    - title: Security / Sicherheit
      labels:
        - security
    - title: Documentation and maintenance / Dokumentation und Wartung
      labels:
        - documentation
        - dependencies
        - chore
    - title: Other changes / Weitere Änderungen
      labels:
        - "*"
