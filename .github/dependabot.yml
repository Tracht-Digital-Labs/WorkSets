version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types:
          - minor
          - patch
    labels:
      - dependencies
      - javascript

  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
      day: monday
      time: "06:15"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    groups:
      cargo-minor-patch:
        update-types:
          - minor
          - patch
    ignore:
      # winvd (virtual desktops) is built against windows 0.58 and exposes its
      # HWND type; a newer windows crate in the app no longer type-checks
      # against it. Lift this once winvd moves to a newer windows release.
      - dependency-name: windows
        versions: [">=0.59"]
    labels:
      - dependencies
      - rust

  - package-ecosystem: cargo
    directory: /fixtures/windows-app
    schedule:
      interval: weekly
      day: monday
      time: "06:20"
      timezone: Europe/Berlin
    open-pull-requests-limit: 3
    groups:
      fixture-cargo-minor-patch:
        update-types:
          - minor
          - patch
    labels:
      - dependencies
      - rust

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
